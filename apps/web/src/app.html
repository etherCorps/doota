		<!-- Installed-PWA launch splash: iOS/Android/desktop boot to a blank screen
		     with no native startup image, so paint a branded logo from the first
		     frame (standalone only) and fade it once the app hydrates
		     (routes/+layout.svelte adds html.app-ready, then removes the node). -->
		<style>
			#app-splash {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: none;
				align-items: center;
				justify-content: center;
				background: #15171e;
			}
			@media all and (display-mode: standalone) {
				#app-splash {
					display: flex;
				}
			}
			#app-splash svg {
				width: 92px;
				height: 92px;
				animation: app-splash-pulse 1.5s ease-in-out infinite;
			}
			html.app-ready #app-splash {
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.35s ease;
			}
			@keyframes app-splash-pulse {
				0%,
				100% {
					transform: scale(1);
					opacity: 0.85;
				}
				50% {
					transform: scale(1.06);
					opacity: 1;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#app-splash svg {
					animation: none;
				}
			}
		</style>
